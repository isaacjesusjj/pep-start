{% extends 'base.html' %}
{% block content %}<div class="page-head"><div><h1>Novo usuário</h1><p>Crie uma conta com permissões adequadas à função.</p></div></div><section class="panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Nome<input name="nome" required></label><label>E-mail<input type="email" name="email" required></label><label>Senha<input type="password" name="senha" minlength="8" required></label><label>Perfil<select name="perfil">{% for p in perfis %}<option>{{ p }}</option>{% endfor %}</select></label><div class="actions"><button class="primary" type="submit">Criar usuário</button><a class="button" href="/usuarios">Cancelar</a></div></form></section>{% endblock %}
