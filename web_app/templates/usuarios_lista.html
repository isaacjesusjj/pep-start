{% extends 'base.html' %}
{% block content %}<div class="page-head"><div><h1>Usuários</h1><p>Controle de perfis e status.</p></div><a class="button primary" href="/usuarios/novo">Novo usuário</a></div>
<div class="table-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th></th></tr></thead><tbody>{% for u in usuarios %}<tr><td>{{ u.nome }}</td><td>{{ u.email }}</td><td>{{ u.perfil }}</td><td>{{ 'Ativo' if u.ativo else 'Inativo' }}</td><td>{% if u.id != usuario.id %}<form method="post" action="/usuarios/{{ u.id }}/alternar"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit">{{ 'Desativar' if u.ativo else 'Ativar' }}</button></form>{% endif %}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
